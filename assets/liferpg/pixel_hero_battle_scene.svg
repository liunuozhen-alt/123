<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <!-- 天空暗黑雷云渐变 -->
    <linearGradient id="bgStormSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0514" />
      <stop offset="30%" stop-color="#1d0a29" />
      <stop offset="65%" stop-color="#3d1238" />
      <stop offset="100%" stop-color="#5c1a30" />
    </linearGradient>

    <!-- 熔岩地底渐变 -->
    <linearGradient id="lavaGround" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b1d16" />
      <stop offset="40%" stop-color="#23100c" />
      <stop offset="100%" stop-color="#110705" />
    </linearGradient>

    <!-- 圣剑雷光剑芒 -->
    <linearGradient id="holyBladeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#a7ffeb" />
      <stop offset="70%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#0091ea" />
    </linearGradient>

    <!-- 弧形剑气波渐变 -->
    <linearGradient id="slashWave" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="40%" stop-color="#00ffff" stop-opacity="0.8" />
      <stop offset="80%" stop-color="#0080ff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0040ff" stop-opacity="0" />
    </linearGradient>

    <!-- 蒸汽时钟魔王铜甲渐变 -->
    <linearGradient id="bronzeArmor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#bcaaa4" />
      <stop offset="40%" stop-color="#8d6e63" />
      <stop offset="80%" stop-color="#5d4037" />
      <stop offset="100%" stop-color="#3e2723" />
    </linearGradient>

    <filter id="ultraGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#00ffff" flood-opacity="0.9"/>
    </filter>
    <filter id="bossDarkGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ff1744" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- ==================== 1. 背景：破碎魔界战场 ==================== -->
  <rect width="480" height="270" fill="url(#bgStormSky)" />

  <!-- 虚空闪电撕裂 -->
  <path d="M 120,0 L 135,35 L 125,45 L 145,85 L 130,95 L 160,140" stroke="#00e5ff" stroke-width="2" fill="none" opacity="0.6" />
  <path d="M 380,0 L 370,40 L 385,55 L 365,100 L 380,115 L 350,150" stroke="#ff007f" stroke-width="2" fill="none" opacity="0.5" />

  <!-- 漂浮在空中的暗黑符文与破碎浮空石岛 -->
  <polygon points="30,80 60,65 95,85 70,105 25,95" fill="#241433" stroke="#5b2d75" stroke-width="1.5" />
  <polygon points="390,70 435,55 465,75 440,95 385,85" fill="#241433" stroke="#752d5b" stroke-width="1.5" />
  <polygon points="180,45 210,35 235,50 215,65 175,55" fill="#180e24" stroke="#432159" stroke-width="1" />

  <!-- 远景魔王地牢石窟群山 -->
  <path d="M 0,165 L 45,120 L 90,150 L 150,110 L 210,155 L 270,115 L 340,160 L 410,105 L 480,145 L 480,270 L 0,270 Z" fill="#1f0d1b" />

  <!-- 暗黑荆棘与焦虑风暴漩涡 (后景) -->
  <g transform="translate(420, 130)" opacity="0.8">
    <ellipse cx="0" cy="0" rx="35" ry="30" fill="#2a081a" stroke="#d50000" stroke-width="2" />
    <path d="M -30,-15 Q 0,-35 30,-10 Q 40,20 0,32 Q -35,20 -30,-15 Z" fill="#380010" />
    <text x="-12" y="4" fill="#ff1744" font-size="12">👁️</text>
    <text x="4" y="8" fill="#ff1744" font-size="10">👁️</text>
    <path d="M -20,25 Q -40,40 -15,50" stroke="#ff1744" stroke-width="2" fill="none" />
    <path d="M 20,25 Q 40,40 15,50" stroke="#ff1744" stroke-width="2" fill="none" />
  </g>

  <!-- 熔岩裂谷地面 -->
  <rect y="160" width="480" height="110" fill="url(#lavaGround)" />
  <rect y="160" width="480" height="8" fill="#5d4037" />
  <rect y="168" width="480" height="4" fill="#3e2723" />

  <!-- 地脉炽热熔浆裂纹 -->
  <g fill="#ff3d00">
    <path d="M 30,175 L 80,182 L 120,178 L 150,185 L 115,188 L 75,184 Z" />
    <path d="M 210,195 L 270,202 L 310,198 L 340,205 L 300,208 L 260,204 Z" />
    <path d="M 360,180 L 410,185 L 450,182 L 475,188 L 440,190 L 400,187 Z" />
    <circle cx="85" cy="180" r="3" fill="#ffeb3b" />
    <circle cx="275" cy="200" r="4" fill="#ffeb3b" />
    <circle cx="420" cy="184" r="3" fill="#ffeb3b" />
  </g>

  <!-- ==================== 2. 日系刺猬金发勇者 (左侧爆发突刺) ==================== -->
  <g transform="translate(100, 105)">
    <!-- 烈烈狂风中飞卷的大红斗篷 (Hero Cape) -->
    <path d="M -16,32 L -58,15 L -48,45 L -62,35 L -45,68 L -18,52 Z" fill="#b71c1c" />
    <path d="M -14,35 L -52,20 L -42,48 L -55,40 L -38,72 L -15,55 Z" fill="#d32f2f" />
    <path d="M -10,38 L -45,25 L -35,50 L -46,45 L -30,75 L -12,58 Z" fill="#f44336" />

    <!-- 勇者战靴与腿部 (压低重心前冲姿态) -->
    <!-- 后腿 (左) -->
    <rect x="-24" y="65" width="14" height="24" fill="#1a237e" rx="2" />
    <rect x="-26" y="78" width="18" height="14" fill="#5d4037" />
    <rect x="-28" y="88" width="22" height="6" fill="#3e2723" />
    <rect x="-18" y="82" width="6" height="6" fill="#ffd700" />
    <!-- 前腿 (右) -->
    <rect x="6" y="60" width="16" height="28" fill="#283593" rx="2" />
    <rect x="6" y="75" width="20" height="16" fill="#6d4c41" />
    <rect x="6" y="87" width="24" height="6" fill="#4e342e" />
    <rect x="18" y="79" width="6" height="6" fill="#ffd700" />

    <!-- 勇者身躯与皇家蓝金铠甲 (Royal Armor) -->
    <rect x="-14" y="28" width="30" height="38" fill="#1565c0" rx="3" stroke="#0d47a1" stroke-width="2" />
    <!-- 黄金飞鹰胸甲镶嵌 -->
    <polygon points="1,32 12,42 -10,42" fill="#ffd700" />
    <polygon points="1,35 8,42 -6,42" fill="#fff59d" />
    <rect x="-10" y="44" width="22" height="12" fill="#1976d2" />
    <!-- 黄金腰带与狮鹫扣 -->
    <rect x="-15" y="56" width="32" height="7" fill="#3e2723" />
    <rect x="-4" y="54" width="10" height="10" fill="#ffd700" />
    <circle cx="1" cy="59" r="3" fill="#ff3d00" />

    <!-- 勇者头部与面部 (坚毅帅气日系主角) -->
    <rect x="-8" y="8" width="20" height="20" fill="#ffdfba" rx="2" />
    <!-- 坚毅大眼与高光 -->
    <rect x="-2" y="14" width="4" height="6" fill="#0d47a1" />
    <rect x="6" y="14" width="4" height="6" fill="#0d47a1" />
    <rect x="0" y="14" width="2" height="2" fill="#ffffff" />
    <rect x="8" y="14" width="2" height="2" fill="#ffffff" />
    <line x1="-3" y1="12" x2="3" y2="13" stroke="#e65100" stroke-width="2" />
    <line x1="5" y1="13" x2="11" y2="12" stroke="#e65100" stroke-width="2" />
    <rect x="1" y="24" width="5" height="2" fill="#c25e4c" />

    <!-- 标志性热血刺猬金发 (Super Saiyan / Dragon Quest Style) -->
    <path d="M -18,8 L -24,-6 L -10,-1 L -5,-18 L 4,-3 L 15,-20 L 18,-3 L 26,-8 L 16,14 L -12,14 Z" fill="#f57f17" />
    <path d="M -14,6 L -20,-2 L -8,0 L -3,-14 L 4,-1 L 13,-14 L 16,-1 L 22,-4 L 14,12 L -8,12 Z" fill="#fbc02d" />
    <path d="M -8,2 L -14,-1 L -4,0 L 0,-8 L 4,0 L 10,-8 L 12,0 L 16,-2 L 10,8 L -2,8 Z" fill="#fff59d" />
    <!-- 红色额带 -->
    <rect x="-10" y="6" width="24" height="4" fill="#d32f2f" />

    <!-- 双手握剑前压姿态 (Holding Sword) -->
    <rect x="12" y="32" width="24" height="9" fill="#ffdfba" />
    <rect x="28" y="30" width="10" height="13" fill="#f57f17" />

    <!-- ==================== 传说道具：神圣雷光剑 Excalibur ==================== -->
    <g transform="translate(36, 36) rotate(-18)" filter="url(#ultraGlow)">
      <!-- 黄金剑柄与护手 -->
      <rect x="-3" y="2" width="6" height="14" fill="#4e342e" />
      <circle cx="0" cy="18" r="5" fill="#ffd700" />
      <path d="M -18,0 L 18,0 L 14,-6 L -14,-6 Z" fill="#ffd700" />
      <circle cx="0" cy="-3" r="4" fill="#00e5ff" />
      <!-- 巨大神圣剑刃 -->
      <polygon points="-6,-6 6,-6 4,-95 0,-112 -4,-95" fill="url(#holyBladeGrad)" />
      <line x1="0" y1="-6" x2="0" y2="-105" stroke="#ffffff" stroke-width="2.5" />
    </g>

    <!-- 剑刃斩出的超华丽半月弧形剑气波 (Slash Wave) -->
    <path d="M 60,-40 Q 140,25 180,85 Q 120,45 50,0 Z" fill="url(#slashWave)" filter="url(#ultraGlow)" />
    
    <!-- 剑光激荡出的魔力火花粒子 -->
    <g fill="#00ffff">
      <circle cx="80" cy="-10" r="3" />
      <circle cx="110" cy="15" r="4" />
      <circle cx="135" cy="40" r="3" />
      <circle cx="160" cy="70" r="4" />
      <circle cx="95" cy="30" r="2" />
      <circle cx="140" cy="10" r="2" />
    </g>

    <!-- 勇者脚底阴影与铭牌 -->
    <ellipse cx="0" cy="94" rx="34" ry="7" fill="rgba(0,0,0,0.6)" />
    <rect x="-30" y="100" width="60" height="18" rx="3" fill="#1b1528" stroke="#f1c40f" stroke-width="2" />
    <text x="0" y="113" fill="#ffd54f" font-size="11" font-weight="900" text-anchor="middle" font-family="monospace">
      ⚔️ 勇者
    </text>
  </g>

  <!-- ==================== 3. 拖延魔王 Chronos Golem (巨大齿轮魔神) ==================== -->
  <g transform="translate(360, 75)" filter="url(#bossDarkGlow)">
    <!-- 恶魔巨大金属重犄角 -->
    <polygon points="-32,-15 -24,-45 -12,-10" fill="#4e342e" stroke="#271406" stroke-width="2.5" />
    <polygon points="32,-15 24,-45 12,-10" fill="#4e342e" stroke="#271406" stroke-width="2.5" />
    <!-- 头部装甲与猩红机械邪眼 -->
    <rect x="-30" y="-12" width="60" height="28" fill="#5d4037" stroke="#271406" stroke-width="3" rx="4" />
    <rect x="-20" y="-4" width="14" height="8" fill="#ff1744" />
    <rect x="6" y="-4" width="14" height="8" fill="#ff1744" />
    <circle cx="-13" cy="0" r="2" fill="#fff" />
    <circle cx="13" cy="0" r="2" fill="#fff" />

    <!-- 巨大青铜蒸汽躯体 -->
    <rect x="-44" y="16" width="88" height="98" fill="url(#bronzeArmor)" stroke="#271406" stroke-width="3.5" rx="8" />
    <rect x="-40" y="20" width="80" height="8" fill="#4e342e" />
    <!-- 铆钉装饰 -->
    <circle cx="-38" cy="34" r="2" fill="#d7ccc8" />
    <circle cx="38" cy="34" r="2" fill="#d7ccc8" />
    <circle cx="-38" cy="98" r="2" fill="#d7ccc8" />
    <circle cx="38" cy="98" r="2" fill="#d7ccc8" />

    <!-- 胸口核心：巨大古罗马时钟 (X 标记) -->
    <circle cx="0" cy="65" r="32" fill="#fff8e1" stroke="#3e2723" stroke-width="4" />
    <circle cx="0" cy="65" r="28" fill="#ffecb3" />
    <!-- 刻度与转动齿轮 -->
    <line x1="0" y1="38" x2="0" y2="44" stroke="#5d4037" stroke-width="3" />
    <line x1="0" y1="86" x2="0" y2="92" stroke="#5d4037" stroke-width="3" />
    <line x1="-24" y1="65" x2="-18" y2="65" stroke="#5d4037" stroke-width="3" />
    <line x1="18" y1="65" x2="24" y2="65" stroke="#5d4037" stroke-width="3" />
    <!-- 血红 X 印记 -->
    <text x="0" y="78" fill="#b71c1c" font-size="36" font-weight="900" text-anchor="middle" font-family="sans-serif">
      X
    </text>

    <!-- 蒸汽重锤巨臂 (左/右) -->
    <rect x="-65" y="28" width="22" height="60" fill="#6d4c41" stroke="#271406" stroke-width="3" rx="4" />
    <circle cx="-54" cy="88" r="14" fill="#3e2723" stroke="#271406" stroke-width="2.5" />
    <rect x="43" y="28" width="22" height="60" fill="#6d4c41" stroke="#271406" stroke-width="3" rx="4" />
    <circle cx="54" cy="88" r="14" fill="#3e2723" stroke="#271406" stroke-width="2.5" />

    <!-- 魔王受击扣血槽与名牌 -->
    <rect x="-55" y="-36" width="110" height="14" rx="3" fill="#1b0000" stroke="#ff5252" stroke-width="2" />
    <rect x="-53" y="-34" width="65" height="10" fill="linear-gradient(90deg, #d50000, #ff1744)" />
    <text x="0" y="132" fill="#ff8a80" font-size="11" font-weight="900" text-anchor="middle" font-family="monospace">
      👾 拖延魔王 (BOSS)
    </text>
  </g>

  <!-- ==================== 4. 手机诱惑小妖 ==================== -->
  <g transform="translate(230, 115)">
    <!-- 红色恶魔双翼 -->
    <path d="M -14,0 L -36,-16 L -26,14 L -14,6 Z" fill="#b71c1c" stroke="#d50000" stroke-width="1.5" />
    <path d="M 14,0 L 36,-16 L 26,14 L 14,6 Z" fill="#b71c1c" stroke="#d50000" stroke-width="1.5" />
    <!-- 恶魔角 -->
    <polygon points="-7,-22 -12,-34 -2,-24" fill="#d50000" />
    <polygon points="7,-22 12,-34 2,-24" fill="#d50000" />

    <!-- 手机机身魔屏 -->
    <rect x="-16" y="-22" width="32" height="54" rx="5" fill="#1a1a1a" stroke="#ff1744" stroke-width="2.5" />
    <rect x="-12" y="-16" width="24" height="42" fill="#b71c1c" />
    <!-- 恶魔奸笑与黄色眼睛 -->
    <rect x="-8" y="-8" width="5" height="5" fill="#ffea00" />
    <rect x="3" y="-8" width="5" height="5" fill="#ffea00" />
    <text x="0" y="14" fill="#ffffff" font-size="12" font-weight="900" text-anchor="middle">😈</text>
    <!-- 红点消息气泡 -->
    <circle cx="12" cy="-18" r="4" fill="#ff1744" stroke="#fff" stroke-width="1" />
    <text x="12" y="-15" fill="#fff" font-size="6" font-weight="900" text-anchor="middle">9+</text>

    <!-- 尾巴 -->
    <path d="M 0,32 Q 14,44 22,36" stroke="#b71c1c" stroke-width="2.5" fill="none" />
    <polygon points="22,34 30,36 25,44" fill="#d50000" />

    <text x="0" y="52" fill="#ff8a80" font-size="10" font-weight="900" text-anchor="middle" font-family="monospace">
      手机诱惑妖
    </text>
  </g>

  <!-- ==================== 5. 赖床史莱姆 ==================== -->
  <g transform="translate(240, 205)">
    <!-- 软泥水滴身体 -->
    <ellipse cx="0" cy="0" rx="28" ry="18" fill="#90caf9" stroke="#1565c0" stroke-width="2.5" />
    <ellipse cx="-6" cy="-4" rx="8" ry="4" fill="#e3f2fd" opacity="0.6" />
    <!-- 蓝色条纹小棉被 -->
    <path d="M -26,4 Q 0,-6 26,4 L 22,16 L -22,16 Z" fill="#eceff1" stroke="#90a4ae" stroke-width="2" />
    <line x1="-15" y1="4" x2="-15" y2="16" stroke="#90caf9" stroke-width="2" />
    <line x1="0" y1="0" x2="0" y2="16" stroke="#90caf9" stroke-width="2" />
    <line x1="15" y1="4" x2="15" y2="16" stroke="#90caf9" stroke-width="2" />
    <!-- 睡眼 -->
    <text x="0" y="-1" fill="#0d47a1" font-size="12" font-weight="900" text-anchor="middle">u_u</text>
    <!-- Zzz 呼噜泡泡 -->
    <text x="22" y="-16" fill="#42a5f5" font-size="14" font-weight="900">Zzz</text>

    <text x="0" y="26" fill="#bbdefb" font-size="10" font-weight="900" text-anchor="middle" font-family="monospace">
      赖床史莱姆
    </text>
  </g>

  <!-- 顶部 JRPG 经典战斗指令框 -->
  <g transform="translate(20, 15)">
    <rect width="230" height="28" rx="3" fill="#1b1528" stroke="#f1c40f" stroke-width="2" />
    <rect x="2" y="2" width="226" height="24" rx="2" fill="#281f3d" />
    <text x="115" y="19" fill="#ffd54f" font-size="12" font-weight="900" text-anchor="middle" font-family="monospace" letter-spacing="1">
      ⚔️ BOSS BATTLE · 阻力歼灭战
    </text>
  </g>
</svg>
